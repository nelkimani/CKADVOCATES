<svg viewBox="120 20 440 495"  xmlns="http://www.w3.org/2000/svg">
  
  

  <defs>
    <linearGradient id="goldLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D8B56B" stop-opacity="0"/>
      <stop offset="30%" stop-color="#D8B56B" stop-opacity="1"/>
      <stop offset="70%" stop-color="#D8B56B" stop-opacity="1"/>
      <stop offset="100%" stop-color="#D8B56B" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="colShaft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#C6D6F0"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="quillBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C6D6F0"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
  <mask id="imagine-text-gaps-fluh9a" maskUnits="userSpaceOnUse"><rect x="0" y="0" width="680" height="530" fill="white"/><rect x="147.02798461914062" y="363.79986572265625" width="385.9440612792969" height="58.77791976928711" fill="black" rx="2"/><rect x="287.7653503417969" y="427.31103515625" width="104.46935272216797" height="35.73341751098633" fill="black" rx="2"/><rect x="239.59559631347656" y="481.3999328613281" width="200.43106079101562" height="20.622264862060547" fill="black" rx="2"/></mask></defs>

  
  

  

  <!-- === LARGE ELEGANT QUILL centred above column === -->
  <g transform="translate(340,148) rotate(-22)">
    <!-- Outer right vane — broad, sweeping -->
    <path d="M2,0 C30,-15 62,-40 70,-95 C58,-80 44,-58 30,-35 C18,-16 8,-5 2,0Z" fill="url(#quillBody)" opacity="0.9"/>
    <!-- Inner right vane highlight -->
    <path d="M2,0 C20,-12 44,-34 50,-85 C40,-70 28,-48 16,-28 C9,-14 4,-4 2,0Z" fill="#C6D6F0" opacity="0.4"/>
    <!-- Outer left vane -->
    <path d="M-2,0 C-26,-18 -52,-45 -56,-100 C-44,-84 -32,-60 -20,-36 C-11,-18 -5,-6 -2,0Z" fill="url(#quillBody)" opacity="0.8"/>
    <!-- Inner left vane highlight -->
    <path d="M-2,0 C-18,-14 -38,-38 -42,-90 C-32,-74 -22,-52 -12,-30 C-6,-16 -3,-5 -2,0Z" fill="#FFFFFF" opacity="0.35"/>

    <!-- Rachis (central shaft) -->
    <line x1="0" y1="8" x2="0" y2="-108" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>

    <!-- Right barbs — fine lines fanning from shaft -->
    <line x1="1" y1="-10" x2="32" y2="-28" stroke="#FFFFFF" stroke-width="0.8" opacity="0.45"/>
    <line x1="1" y1="-22" x2="38" y2="-44" stroke="#FFFFFF" stroke-width="0.8" opacity="0.45"/>
    <line x1="0" y1="-34" x2="42" y2="-58" stroke="#FFFFFF" stroke-width="0.8" opacity="0.4"/>
    <line x1="0" y1="-47" x2="44" y2="-72" stroke="#FFFFFF" stroke-width="0.75" opacity="0.35"/>
    <line x1="-1" y1="-60" x2="40" y2="-86" stroke="#FFFFFF" stroke-width="0.7" opacity="0.3"/>
    <line x1="-1" y1="-73" x2="32" y2="-97" stroke="#FFFFFF" stroke-width="0.65" opacity="0.25"/>

    <!-- Left barbs -->
    <line x1="-1" y1="-10" x2="-30" y2="-30" stroke="#FFFFFF" stroke-width="0.8" opacity="0.45"/>
    <line x1="-1" y1="-22" x2="-36" y2="-46" stroke="#FFFFFF" stroke-width="0.8" opacity="0.45"/>
    <line x1="-1" y1="-34" x2="-39" y2="-60" stroke="#FFFFFF" stroke-width="0.8" opacity="0.4"/>
    <line x1="-1" y1="-47" x2="-40" y2="-74" stroke="#FFFFFF" stroke-width="0.75" opacity="0.35"/>
    <line x1="-1" y1="-60" x2="-37" y2="-87" stroke="#FFFFFF" stroke-width="0.7" opacity="0.3"/>
    <line x1="-1" y1="-73" x2="-28" y2="-98" stroke="#FFFFFF" stroke-width="0.65" opacity="0.25"/>

    <!-- Fluffy tip wisps -->
    <path d="M0,-105 C-6,-112 -12,-116 -8,-122 C-4,-118 0,-112 0,-105Z" fill="#FFFFFF" opacity="0.5"/>
    <path d="M0,-105 C5,-113 11,-117 8,-123 C3,-118 0,-112 0,-105Z" fill="#FFFFFF" opacity="0.4"/>

    <!-- Calligraphic nib — pointed gold tip -->
    <path d="M-3,5 C-2,12 0,20 2,26 C1,20 0,13 3,5 C1,8 -1,8 -3,5Z" fill="#D8B56B"/>
    <path d="M0,22 L0,36" stroke="#D8B56B" stroke-width="1.2" stroke-linecap="round"/>
  </g>

  <!-- === COLUMN (slightly lower to give quill room) === -->
  <rect x="284" y="200" width="112" height="10" rx="2" fill="#FFFFFF"/>
  <rect x="290" y="210" width="100" height="7" rx="2" fill="#E4ECF8" opacity="0.9"/>
  <rect x="302" y="217" width="76" height="6" rx="1" fill="#FFFFFF"/>

  <!-- Fluted shafts -->
  <rect x="302" y="223" width="10" height="80" rx="2" fill="url(#colShaft)"/>
  <rect x="315" y="223" width="10" height="80" rx="2" fill="url(#colShaft)" opacity="0.85"/>
  <rect x="328" y="223" width="10" height="80" rx="2" fill="url(#colShaft)"/>
  <rect x="341" y="223" width="10" height="80" rx="2" fill="url(#colShaft)" opacity="0.85"/>
  <rect x="354" y="223" width="10" height="80" rx="2" fill="url(#colShaft)"/>
  <rect x="367" y="223" width="10" height="80" rx="2" fill="url(#colShaft)" opacity="0.85"/>

  <!-- Base -->
  <rect x="297" y="303" width="86" height="7" rx="1" fill="#FFFFFF" opacity="0.9"/>
  <rect x="284" y="310" width="112" height="9" rx="2" fill="#FFFFFF"/>
  <rect x="271" y="319" width="138" height="8" rx="2" fill="#FFFFFF" opacity="0.85"/>
  <rect x="258" y="327" width="164" height="8" rx="2" fill="#FFFFFF" opacity="0.7"/>

  <!-- Gold divider -->
  <line x1="160" y1="360" x2="520" y2="360" stroke="url(#goldLine)" stroke-width="1.2"/>
  <polygon points="340,354 345,360 340,366 335,360" fill="#D8B56B" opacity="0.85"/>

  <!-- === ALL TEXT in one bold navy === -->
  <text x="340" y="410" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="48" font-weight="700" letter-spacing="4" fill="#FFFFFF">C.K. MUTEGI</text>

  <line x1="242" y1="422" x2="438" y2="422" stroke="#D8B56B" stroke-width="0.8" opacity="0.55" mask="url(#imagine-text-gaps-fluh9a)"/>

  <text x="340" y="455" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="700" letter-spacing="6" fill="#FFFFFF">&amp; CO</text>

  <line x1="220" y1="470" x2="460" y2="470" stroke="#D8B56B" stroke-width="0.8" opacity="0.45"/>

  <text x="340" y="497" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="11" fill="#FFFFFF">ADVOCATES</text>

</svg>